<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vinted V2 settings</title>
    <style>
      body { font: 16px/1.4 system-ui, sans-serif; max-width: 36rem; margin: 2rem auto; }
      label { display: block; margin: 1rem 0 0.3rem; font-weight: 650; }
      input { width: 100%; padding: 0.5rem; }
      button { margin-top: 1rem; padding: 0.6rem 1rem; }
      p { color: #444; }
    </style>
  </head>
  <body>
    <h1>Listing Writer Vinted V2</h1>
    <p>
      Connects this extension to your Listing Writer site. It fills the item you just prepared
      and does not press Sell.
    </p>
    <label for="appUrl">App URL</label>
    <input id="appUrl" type="url" value="https://hahm-ebay-lister-tau-one.vercel.app" readonly />
    <label for="appSecret">Access code (APP_SECRET)</label>
    <input id="appSecret" type="password" autocomplete="off" />
    <button id="save" type="button">Save</button>
    <p id="status"></p>
    <script src="options.js"></script>
  </body>
</html>
